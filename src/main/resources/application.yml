spring:
  application:
    name: usuario-api

  # Sem login por usuário/senha do Spring: a autenticação é só por JWT (JwtAuthFilter). Sem isto
  # o Spring Security cria um usuário "user" com senha aleatória e a escreve no log do arranque.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # Carrega o .env local para a senha do JWT não precisar estar
  # exportado no shell. Opcional: em produção as variáveis vêm do ambiente.
  config:
    import:
      - optional:file:./.env[.properties]

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/usuario_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:nexo_admin}
    # Sem default de propósito: a senha vem do ambiente (.env, compose ou secret).
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
          fetch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        default_batch_fetch_size: 25

  # Escapa não-ASCII como \uXXXX no JSON — imune a double-encoding de charset,
  # igual ao monólito (o client decodifica de volta).
  jackson:
    generator:
      escape-non-ascii: true

  # Envio da foto de perfil; o cliente já reduz a imagem antes de mandar.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

nexo:
  jwt:
    # Sem default: o segredo vem SEMPRE do ambiente. Precisa ser o MESMO do monólito
    # (NEXO_JWT_SECRET) para que o token emitido aqui seja aceito lá.
    secret: ${NEXO_JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    max-tentativas-por-ip: ${AUTH_MAX_TENTATIVAS_IP:100}
    max-refresh-invalidos-por-ip: ${AUTH_MAX_REFRESH_IP:30}
  proxy:
    saltos-confiaveis: ${PROXY_SALTOS_CONFIAVEIS:0}
  pedagogico:
    # Catálogo de turmas e matérias (hoje no monólito). Desligado, os cadastros aceitam
    # qualquer id e nenhuma chamada é feita.
    enabled: ${PEDAGOGICO_ENABLED:true}
    url: ${PEDAGOGICO_URL:http://localhost:8082}
    timeout-ms: 3000
  comunicacao:
    # Chat, avisos, dúvidas e mensagens. Este serviço avisa quando alguém é cadastrado ou muda de
    # nome, foto ou privacidade. Desligado, nenhuma chamada é feita.
    enabled: ${COMUNICACAO_ENABLED:true}
    url: ${COMUNICACAO_URL:http://localhost:8083}
    timeout-ms: 3000
  gamificacao:
    # XP, ranking e desafios. Este serviço avisa quando um aluno é cadastrado ou muda de nome,
    # foto ou privacidade (exibir no ranking, perfil público). Desligado, nenhuma chamada é feita.
    enabled: ${GAMIFICACAO_ENABLED:true}
    url: ${GAMIFICACAO_URL:http://localhost:8084}
    timeout-ms: 3000
  seed:
    # Contas de exemplo (diretor/admin/professor/aluno, senha 123456). Só em dev.
    enabled: ${NEXO_SEED_ENABLED:false}
