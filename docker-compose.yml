# Sobe o usuario-api com o Postgres dele.
#
#   cp .env.example .env     → preencha NEXO_JWT_SECRET e DB_PASSWORD
#   docker compose up --build            → API em http://localhost:8081
#   docker compose up -d postgres-usuario → só o banco (e a API via ./mvnw spring-boot:run)
#   docker compose down -v               → para e apaga o banco
name: nexo-usuario

services:
  postgres-usuario:
    image: postgres:16-alpine
    container_name: nexo-postgres-usuario
    environment:
      POSTGRES_USER: nexo_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: usuario_db
    ports:
      # 5436 no host: na maquina desenvolvida, portas padrões estão ocupadas ocupadas por instâncias do Postgres instalado.
      # Só importa para quem roda a API fora do Docker; a API em container usa a rede interna.
      - "127.0.0.1:${DB_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_usuario_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_admin -d usuario_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  usuario-api:
    build: .
    image: nexo-usuario-api:local
    container_name: nexo-usuario-api
    depends_on:
      postgres-usuario:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8081}:8081"
    environment:
      # Dentro da rede do compose o banco é o serviço, não localhost.
      DB_URL: jdbc:postgresql://postgres-usuario:5432/usuario_db
      DB_USER: nexo_admin
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      # O MESMO segredo do pedagogico-api (e do monólito) — é o que faz o token emitido aqui valer lá.
      NEXO_JWT_SECRET: ${NEXO_JWT_SECRET:?defina NEXO_JWT_SECRET no .env (openssl rand -base64 48)}
      # O pedagogico-api roda no host (8082); de dentro do container ele é host.docker.internal.
      PEDAGOGICO_URL: ${PEDAGOGICO_URL_DOCKER:-http://host.docker.internal:8082}
      PEDAGOGICO_ENABLED: ${PEDAGOGICO_ENABLED:-true}
      # O comunicacao-api também roda no host (8083).
      COMUNICACAO_URL: ${COMUNICACAO_URL_DOCKER:-http://host.docker.internal:8083}
      COMUNICACAO_ENABLED: ${COMUNICACAO_ENABLED:-true}
      # O gamificacao-api também roda no host (8084).
      GAMIFICACAO_URL: ${GAMIFICACAO_URL_DOCKER:-http://host.docker.internal:8084}
      GAMIFICACAO_ENABLED: ${GAMIFICACAO_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      NEXO_SEED_ENABLED: ${NEXO_SEED_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Endurecimento do runtime, no mesmo padrão do monólito: filesystem só de leitura
    # (o único lugar que escreve é o /tmp do Tomcat, em tmpfs).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres_usuario_data:
